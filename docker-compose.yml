services:
  postgres:
    image: postgres:16-alpine
    container_name: lead-intake-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zaid@postgres
      POSTGRES_DB: leadintake
    ports:
      - "5432:5432"
    volumes:
      - lead_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d leadintake"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lead_pg_data: